<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">PORSCHE</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#models">Models</a>
      <a href="index.html#design">Design</a>
      <a href="index.html#performance">Performance</a>
    </nav>
    <div class="header-actions">
      <a href="account-created.html" class="header-button">Status</a>
    </div>
  </header>

  <main class="account-page">
    <section class="account-panel">
      <span class="eyebrow">Create your account</span>
      <h1>Join the driving experience</h1>
      <p>Create your Porsche-inspired account to save configurations, track orders, and unlock exclusive offers.</p>

      <form id="create-account-form" class="account-form">
        <label>
          Full Name
          <input type="text" name="fullName" placeholder="Enter your full name" required>
        </label>
        <label>
          Email Address
          <input type="email" name="email" placeholder="name@example.com" required>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Create a strong password" required>
        </label>
        <button class="button button-primary" type="submit">Create Account</button>
      </form>

      <div class="account-links">
        <a href="index.html">Back to Home</a>
      </div>
    </section>
  </main>
</body>
</html>
